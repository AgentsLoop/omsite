name: OmGithub repository build

run-name: "OmGithub build ${{ inputs.source_owner }}/${{ inputs.source_repo }} @ ${{ inputs.source_sha }} (${{ inputs.request_id }})"

on:
  workflow_dispatch:
    inputs:
      source_owner:
        description: Public source repository owner
        required: true
        type: string
      source_repo:
        description: Public source repository name
        required: true
        type: string
      source_sha:
        description: Exact source commit to build
        required: true
        type: string
      source_path:
        description: Optional repository subdirectory containing the game
        required: false
        default: ''
        type: string
      source_entry:
        description: Optional HTML entry file to rename to index.html
        required: false
        default: ''
        type: string
      build_runner:
        description: GitHub-hosted runner used to build and capture the game
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
      request_id:
        description: Unique OmGithub build request identifier
        required: true
        type: string
      upload_url:
        description: OmGithub endpoint that receives the deploy ZIP
        required: true
        type: string
      upload_token:
        description: One-time token for the deploy ZIP upload
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.build_runner }}
    timeout-minutes: 30
    steps:
      - name: Check out the requested public commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_owner }}/${{ inputs.source_repo }}
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false

      - name: Check out trusted metadata extractor
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: metadata-runtime
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Chrome for Testing on macOS
        if: runner.os == 'macOS'
        id: chrome_for_testing
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install OpenCode
        shell: bash
        run: /usr/bin/time -p npm install --global opencode-ai

      - name: Extract and validate committed catalog metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_JSON }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_METADATA_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          OMGHITHUB_SOURCE_DIR: ${{ github.workspace }}/source
          OMGHITHUB_SOURCE_OWNER: ${{ inputs.source_owner }}
          OMGHITHUB_SOURCE_REPO: ${{ inputs.source_repo }}
          OMGHITHUB_SOURCE_SHA: ${{ inputs.source_sha }}
          OMGHITHUB_SOURCE_PATH: ${{ inputs.source_path }}
          OMGHITHUB_SOURCE_ENTRY: ${{ inputs.source_entry }}
          OMGHITHUB_METADATA_OUTPUT: ${{ runner.temp }}/omgithub-catalog-metadata.json
          OMGHITHUB_TRANSCRIPT_OUTPUT: ${{ runner.temp }}/omgithub-opencode-log.jsonl
        run: /usr/bin/time -p node metadata-runtime/scripts/extract-catalog-metadata.mjs

      - name: Install dependencies
        id: primary_install
        continue-on-error: true
        working-directory: source
        shell: bash
        env:
          OMGHITHUB_SOURCE_PATH: ${{ inputs.source_path }}
          OMGHITHUB_SOURCE_ENTRY: ${{ inputs.source_entry }}
        run: |
          set -euo pipefail
          project_dir="${OMGHITHUB_SOURCE_PATH:-}"
          source_entry="${OMGHITHUB_SOURCE_ENTRY:-}"
          if [[ -z "$project_dir" ]]; then project_dir='.'; fi
          [[ "$project_dir" != /* && "$project_dir" != *'..'* ]] || { echo 'Invalid source path.' >&2; exit 1; }
          [[ "$source_entry" != /* && "$source_entry" != *'..'* ]] || { echo 'Invalid source entry.' >&2; exit 1; }
          [[ -d "$project_dir" ]] || { echo "Source path does not exist: $project_dir" >&2; exit 1; }
          build_dir="$project_dir"
          while [[ "$build_dir" != '.' && ! -f "$build_dir/package.json" ]]; do
            build_dir="${build_dir%/*}"
            [[ -n "$build_dir" ]] || build_dir='.'
          done
          if [[ ! -f "$build_dir/package.json" ]]; then
            echo 'No package.json found; treating the repository as a static site.'
          else
            cd "$build_dir"
            echo "Installing dependencies from $build_dir for selected source $project_dir."
            if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
              npm ci --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi
          fi

      - name: Build the repository
        id: primary_build
        continue-on-error: true
        working-directory: source
        shell: bash
        env:
          OMGHITHUB_SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          project_dir="${OMGHITHUB_SOURCE_PATH:-}"
          if [[ -z "$project_dir" ]]; then project_dir='.'; fi
          build_dir="$project_dir"
          while [[ "$build_dir" != '.' && ! -f "$build_dir/package.json" ]]; do
            build_dir="${build_dir%/*}"
            [[ -n "$build_dir" ]] || build_dir='.'
          done
          has_vite='false'
          if [[ -f "$build_dir/package.json" ]] && node -e "const p=require('./$build_dir/package.json'); process.exit((p.dependencies?.vite || p.devDependencies?.vite || String(p.scripts?.build || '').includes('vite')) ? 0 : 1)"; then
            has_vite='true'
          fi
          if [[ "$build_dir" != "$project_dir" && "$has_vite" == 'true' ]]; then
            relative_project="${project_dir#"$build_dir"/}"
            vite_config="$RUNNER_TEMP/omgithub-vite.config.mjs"
            printf '%s\n' 'export default {};' > "$vite_config"
            cd "$build_dir"
            npx vite build "$relative_project" --config "$vite_config"
          elif [[ -f "$build_dir/package.json" ]] && node -e "const p=require('./$build_dir/package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            cd "$build_dir"
            if ! npm run build; then
              if node -e "const p=require('./package.json'); process.exit(String(p.scripts?.build || '').includes('vite') ? 0 : 1)"; then
                echo 'Default Vite target failed; retrying with esnext for modern browser modules.'
                rm -rf dist build
                npm run build -- --target esnext
              else
                exit 1
              fi
            fi
          else
            echo 'No npm build script found; packaging the static source directory.'
          fi

      - name: Recover failed build with OpenCode
        if: steps.primary_install.outcome == 'failure' || steps.primary_build.outcome == 'failure'
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_JSON }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_BUILD_MODEL || vars.OPENCODE_METADATA_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          OMGHITHUB_SOURCE_DIR: ${{ github.workspace }}/source
          OMGHITHUB_SOURCE_OWNER: ${{ inputs.source_owner }}
          OMGHITHUB_SOURCE_REPO: ${{ inputs.source_repo }}
          OMGHITHUB_SOURCE_SHA: ${{ inputs.source_sha }}
          OMGHITHUB_SOURCE_PATH: ${{ inputs.source_path }}
          OMGHITHUB_SOURCE_ENTRY: ${{ inputs.source_entry }}
          OMGHITHUB_TRANSCRIPT_OUTPUT: ${{ runner.temp }}/omgithub-opencode-log.jsonl
        run: /usr/bin/time -p node metadata-runtime/scripts/recover-game-build.mjs

      - name: Prepare deployable files
        working-directory: source
        shell: bash
        env:
          OMGHITHUB_SOURCE_PATH: ${{ inputs.source_path }}
          OMGHITHUB_SOURCE_ENTRY: ${{ inputs.source_entry }}
        run: |
          set -euo pipefail
          project_dir="${OMGHITHUB_SOURCE_PATH:-}"
          source_entry="${OMGHITHUB_SOURCE_ENTRY:-}"
          if [[ -z "$project_dir" ]]; then project_dir='.'; fi
          [[ "$source_entry" != /* && "$source_entry" != *'..'* ]] || { echo 'Invalid source entry.' >&2; exit 1; }
          build_dir="$project_dir"
          while [[ "$build_dir" != '.' && ! -f "$build_dir/package.json" ]]; do
            build_dir="${build_dir%/*}"
            [[ -n "$build_dir" ]] || build_dir='.'
          done
          parent_dist=''
          if [[ "$build_dir" != "$project_dir" && -d "$build_dir/dist" ]]; then
            relative_project="${project_dir#"$build_dir"/}"
            if [[ -f "$build_dir/dist/$relative_project/index.html" ]]; then
              parent_dist="$GITHUB_WORKSPACE/source/$build_dir/dist/$relative_project"
            fi
          fi
          cd "$project_dir"
          build_root="$GITHUB_WORKSPACE/source/omgithub-build"
          rm -rf "$build_root"
          mkdir -p "$build_root"
          deploy_dir=''
          for candidate in "$parent_dist" dist build .output/public .output out dist/client; do
            [[ -n "$candidate" ]] || continue
            if [[ -f "$candidate/index.html" ]]; then
              deploy_dir="$candidate"
              break
            fi
          done
          if [[ -z "$deploy_dir" ]]; then
            generated_index="$(find . -path './.git' -prune -o -path './node_modules' -prune -o -type f -name index.html -print | sort | sed -n '1p')"
            if [[ -n "$generated_index" && "$generated_index" != './index.html' ]]; then
              deploy_dir="${generated_index%/index.html}"
            fi
          fi
          if [[ -n "$source_entry" && -f "$source_entry" ]]; then
            rsync -a --exclude='.git' --exclude='node_modules' --exclude='omgithub-build' ./ "$build_root/"
            mv -f "$build_root/$source_entry" "$build_root/index.html"
          elif [[ -n "$deploy_dir" ]]; then
            cp -a "$deploy_dir"/. "$build_root/"
          elif [[ -f index.html ]]; then
            rsync -a --exclude='.git' --exclude='node_modules' --exclude='omgithub-build' ./ "$build_root/"
          else
            echo 'The build did not produce a deployable index.html in a known output directory, the source root, or the requested source entry.' >&2
            exit 1
          fi
          if [[ -d screenshots ]]; then
            cp -a screenshots "$build_root/"
          fi
          for static_dir in assets public models textures images audio sounds media; do
            if [[ -d "$static_dir" ]]; then
              mkdir -p "$build_root/$static_dir"
              rsync -a "$static_dir/" "$build_root/$static_dir/"
            fi
          done
          test -f "$build_root/index.html"

      - name: Verify WebGL2 before macOS capture
        if: runner.os == 'macOS'
        shell: bash
        env:
          OMGHITHUB_CHROME_BIN: ${{ steps.chrome_for_testing.outputs.chrome-path }}
        run: /usr/bin/time -p node metadata-runtime/scripts/check-webgl2.mjs

      - name: Capture a screenshot when none was committed
        working-directory: source
        shell: bash
        env:
          OMGHITHUB_MACOS_CHROME_BIN: ${{ steps.chrome_for_testing.outputs.chrome-path }}
        run: |
          set -euo pipefail
          build_root="$GITHUB_WORKSPACE/source/omgithub-build"
          if compgen -G "$build_root/screenshots/final-*" > /dev/null; then
            echo 'Using committed final screenshot(s).'
          else
            mkdir -p "$build_root/screenshots"
            capture_index="$RUNNER_TEMP/omgithub-index.html"
            cp "$build_root/index.html" "$capture_index"
            python3 - "$build_root" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          paths = [root / 'index.html']
          assets = root / 'assets'
          if assets.is_dir():
              paths.extend(assets.rglob('*.js'))
          for path in paths:
              text = path.read_text(errors='ignore')
              for quote in ("'", '"', '`'):
                  text = text.replace(f'powerPreference: {quote}high-performance{quote}', f'powerPreference: {quote}low-power{quote}')
              path.write_text(text)
          PY
            python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); h=p.read_text(); s="""<script>addEventListener("load",()=>setTimeout(()=>document.querySelector("#start,[data-game-start]")?.click(),150))</script>"""; p.write_text(h.replace("</body>", s+"</body>"))' "$build_root/index.html"
            preview_log="$RUNNER_TEMP/omgithub-preview.log"
            python3 -m http.server 4173 --directory "$build_root" > "$preview_log" 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            for _ in {1..30}; do
              if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null
            if [[ "${RUNNER_OS:-}" == 'macOS' ]]; then
              chrome_bin="$OMGHITHUB_MACOS_CHROME_BIN"
              [[ -x "$chrome_bin" ]] || { echo 'Chrome for Testing is unavailable on this macOS runner.' >&2; exit 1; }
            elif command -v google-chrome > /dev/null; then
              chrome_bin="$(command -v google-chrome)"
            elif [[ -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]]; then
              chrome_bin='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
            else
              echo 'Google Chrome is not installed on this runner.' >&2
              exit 1
            fi
            run_with_timeout() {
              local seconds="$1"
              shift
              python3 - "$seconds" "$@" <<'PY'
          import os
          import signal
          import subprocess
          import sys

          process = subprocess.Popen(sys.argv[2:], start_new_session=True)
          try:
              raise SystemExit(process.wait(timeout=float(sys.argv[1])))
          except subprocess.TimeoutExpired:
              os.killpg(process.pid, signal.SIGKILL)
              process.wait()
              raise SystemExit(124)
          PY
            }
            chrome_args=(--headless=new --no-sandbox --no-first-run --no-default-browser-check --enable-webgl --run-all-compositor-stages-before-draw --virtual-time-budget=3000 '--window-size=960,540' "--user-data-dir=$RUNNER_TEMP/omgithub-chrome-capture")
            if [[ "${RUNNER_OS:-}" == 'macOS' ]]; then
              chrome_args+=(--use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --disable-gpu-vsync --disable-frame-rate-limit)
            else
              chrome_args+=(--disable-gpu-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader)
            fi
            if ! run_with_timeout 45 "$chrome_bin" "${chrome_args[@]}" --screenshot="$build_root/screenshots/final-build.png" http://127.0.0.1:4173/; then
              run_with_timeout 15 "$chrome_bin" "${chrome_args[@]}" --virtual-time-budget=1000 --screenshot="$build_root/screenshots/final-build.png" http://127.0.0.1:4173/ || true
            fi
            if command -v firefox > /dev/null && test -s "$build_root/screenshots/final-build.png" && (( $(wc -c < "$build_root/screenshots/final-build.png") < 10000 )); then
              firefox_capture="$build_root/screenshots/final-firefox.png"
              run_with_timeout 30 firefox --headless --window-size 960,540 --screenshot "$firefox_capture" http://127.0.0.1:4173/ || true
              if test -s "$firefox_capture"; then mv "$firefox_capture" "$build_root/screenshots/final-build.png"; fi
            fi
            if test -s "$build_root/screenshots/final-build.png" && (( $(wc -c < "$build_root/screenshots/final-build.png") < 1000 )); then rm "$build_root/screenshots/final-build.png"; fi
            if ! test -s "$build_root/screenshots/final-build.png"; then
              source_screenshot="$(find "$GITHUB_WORKSPACE/source" -type f | grep -Eiv '/(reference|assets|public)/' | grep -Ei '/[^/]*(screenshot|gameplay|hud|title|beauty|pause|combat|game_)[^/]*\.(png|jpe?g|webp)$' | head -n 1 || true)"
              test -n "$source_screenshot"
              cp "$source_screenshot" "$build_root/screenshots/final-build.${source_screenshot##*.}"
            fi
            mv "$capture_index" "$build_root/index.html"
            find "$build_root/screenshots" -maxdepth 1 -type f -name 'final-*' -size +0c -print -quit | grep -q .
          fi

      - name: Mask the one-time upload token
        shell: bash
        run: echo "::add-mask::${{ inputs.upload_token }}"

      - name: Upload deployable ZIP to OmGithub
        working-directory: source
        shell: bash
        env:
          OMGHITHUB_UPLOAD_URL: ${{ inputs.upload_url }}
          OMGHITHUB_UPLOAD_TOKEN: ${{ inputs.upload_token }}
          OMGHITHUB_SOURCE_OWNER: ${{ inputs.source_owner }}
          OMGHITHUB_SOURCE_REPO: ${{ inputs.source_repo }}
          OMGHITHUB_SOURCE_SHA: ${{ inputs.source_sha }}
          OMGHITHUB_SOURCE_PATH: ${{ inputs.source_path }}
          OMGHITHUB_SOURCE_ENTRY: ${{ inputs.source_entry }}
        run: |
          set -euo pipefail
          /usr/bin/time -p cp "$RUNNER_TEMP/omgithub-catalog-metadata.json" omgithub-build/.omgithub-metadata.json
          /usr/bin/time -p cp "$RUNNER_TEMP/omgithub-opencode-log.jsonl" omgithub-build/.omgithub-opencode-log.jsonl
          (cd omgithub-build && zip -qr ../omgithub-build.zip .)
          test -s omgithub-build.zip
          upload_part() {
            local file="$1" index="$2" count="$3"
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              -X POST \
              -H 'content-type: application/zip' \
              -H "x-omgithub-build-token: $OMGHITHUB_UPLOAD_TOKEN" \
              -H "x-omgithub-source-owner: $OMGHITHUB_SOURCE_OWNER" \
              -H "x-omgithub-source-repo: $OMGHITHUB_SOURCE_REPO" \
              -H "x-omgithub-source-sha: $OMGHITHUB_SOURCE_SHA" \
              -H "x-omgithub-source-path: $OMGHITHUB_SOURCE_PATH" \
              -H "x-omgithub-source-entry: $OMGHITHUB_SOURCE_ENTRY" \
              -H "x-omgithub-build-run: $GITHUB_RUN_ID" \
              -H "x-omgithub-build-part: $index" \
              -H "x-omgithub-build-parts: $count" \
              --data-binary "@$file" \
              "$OMGHITHUB_UPLOAD_URL"
          }
          upload_size=$((90 * 1024 * 1024))
          zip_size=$(wc -c < omgithub-build.zip)
          if (( zip_size <= upload_size )); then
            upload_part omgithub-build.zip 0 1
          else
            python3 - omgithub-build.zip "$upload_size" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          size = int(sys.argv[2])
          with source.open('rb') as stream:
              for index, chunk in enumerate(iter(lambda: stream.read(size), b'')):
                  Path(f'omgithub-build.part.{index:04d}').write_bytes(chunk)
          PY
            parts=(omgithub-build.part.*)
            for index in "${!parts[@]}"; do upload_part "${parts[$index]}" "$index" "${#parts[@]}"; done
          fi
